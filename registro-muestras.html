<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Muestras de Campo</title>
<style>
  :root{
    --paper:#EDE6D3;
    --card:#F7F3E8;
    --ink:#2B2A25;
    --ink-soft:#6b6558;
    --moss:#445A34;
    --moss-dark:#33452A;
    --clay:#B5482D;
    --soil:#8A7355;
    --line: rgba(43,42,37,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(rgba(43,42,37,0.035) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:28px;
    flex-wrap:wrap; gap:8px;
  }
  h1{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:700; font-size:28px; margin:0;
    letter-spacing:0.5px;
  }
  .meta-count{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1px;
  }

  .entry-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 24px 24px;
    position:relative;
    margin-bottom:36px;
  }
  .entry-card::before{
    content:"";
    position:absolute; left:0; top:12px; bottom:12px; width:0;
    border-left:2px dashed var(--soil);
    opacity:0.5;
  }
  .entry-card{padding-left:32px;}
  .form-title{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--soil);
    margin:0 0 16px;
  }
  .grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px 18px;
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  label{
    font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft);
    font-weight:600;
  }
  input, select, textarea{
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:3px;
    padding:9px 10px; outline:none;
  }
  #idInput{font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing:1px;}
  input:focus, select:focus, textarea:focus{border-color:var(--moss); box-shadow:0 0 0 3px rgba(68,90,52,0.12);}
  input.error, #idInput.error{border-color:var(--clay); box-shadow:0 0 0 3px rgba(181,72,45,0.15);}
  textarea{resize:vertical; min-height:52px;}
  .id-row{position:relative;}
  .id-error-msg{
    display:none; color:var(--clay); font-size:12.5px; font-weight:600; margin-top:2px;
  }
  .id-error-msg.show{display:block;}
  .photo-row{display:flex; align-items:center; gap:12px;}
  .photo-preview{
    width:52px; height:52px; border-radius:3px; object-fit:cover;
    border:1px solid var(--line); display:none; background:#fff;
  }
  .photo-preview.show{display:block;}
  .file-btn{
    font-size:13px; padding:8px 12px; border:1px solid var(--soil); background:#fff;
    border-radius:3px; cursor:pointer; color:var(--ink);
  }
  .actions{margin-top:18px; display:flex; align-items:center; gap:14px;}
  .save-btn{
    background:var(--moss); color:#fff; border:none; border-radius:3px;
    padding:11px 22px; font-size:14.5px; font-weight:600; cursor:pointer;
    letter-spacing:0.3px;
  }
  .save-btn:hover{background:var(--moss-dark);}
  .save-btn:active{transform:scale(0.98);}
  .save-hint{font-size:12.5px; color:var(--ink-soft);}

  .sync-row{
    display:flex; align-items:center; gap:12px; margin-bottom:26px; flex-wrap:wrap;
  }
  .sync-btn{
    background:#fff; color:var(--ink); border:1px solid var(--soil); border-radius:3px;
    padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .sync-btn:hover{background:var(--card);}
  .sync-btn:disabled{opacity:0.55; cursor:default;}
  .sync-status{font-size:12.5px; color:var(--ink-soft);}
  .sync-status.error{color:var(--clay);}
  .sync-status.ok{color:var(--moss-dark);}
  .list-title{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--soil);
    margin:0 0 14px;
  }
  .empty{
    border:1px dashed var(--soil); border-radius:4px; padding:32px 20px;
    text-align:center; color:var(--ink-soft); font-size:14px;
  }
  .cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}
  .tag{
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:14px 16px 16px; position:relative;
  }
  .tag::after{
    content:""; position:absolute; top:0; left:16px; right:16px; height:1px;
    background:repeating-linear-gradient(to right, var(--soil) 0 6px, transparent 6px 11px);
    opacity:0.55;
  }
  .tag-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .tag-id{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:16px; font-weight:700; letter-spacing:0.5px; word-break:break-all;
  }
  .tag-num{font-size:11px; color:var(--ink-soft); font-family: ui-monospace, monospace;}
  .tag-type{
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:0.5px;
    text-transform:uppercase; color:var(--moss-dark); background:rgba(68,90,52,0.12);
    padding:3px 8px; border-radius:2px; margin-bottom:8px;
  }
  .tag-body{display:flex; gap:10px;}
  .tag-photo{width:56px; height:56px; border-radius:3px; object-fit:cover; border:1px solid var(--line); flex-shrink:0;}
  .tag-info{font-size:12.5px; color:var(--ink-soft); line-height:1.5; min-width:0;}
  .tag-info b{color:var(--ink); font-weight:600;}
  .tag-notes{font-size:12.5px; color:var(--ink); margin-top:8px; line-height:1.4;}
  .tag-remove{
    font-size:11.5px; color:var(--clay); background:none; border:none; cursor:pointer;
    padding:0; margin-top:10px; text-decoration:underline; letter-spacing:0.3px;
  }
  .stamp{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) rotate(-9deg);
    border:3px solid var(--clay); color:var(--clay); font-weight:800; font-size:22px;
    letter-spacing:2px; padding:6px 14px; border-radius:6px; text-transform:uppercase;
    background:rgba(247,243,232,0.94); opacity:0; pointer-events:none;
    font-family: Georgia, serif;
  }
  .stamp.show{animation: stampIn 1.6s ease forwards;}
  @keyframes stampIn{
    0%{opacity:0; transform:translate(-50%,-50%) rotate(-9deg) scale(1.6);}
    12%{opacity:1; transform:translate(-50%,-50%) rotate(-9deg) scale(1);}
    16%{transform:translate(-50%,-50%) rotate(-9deg) scale(1.04);}
    20%{transform:translate(-50%,-50%) rotate(-9deg) scale(1);}
    82%{opacity:1;}
    100%{opacity:0;}
  }
  .shake{animation: shakeX 0.45s ease;}
  @keyframes shakeX{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(5px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(3px);}
  }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#F7F3E8; padding:10px 18px; border-radius:4px;
    font-size:13.5px; opacity:0; transition:opacity 0.25s ease; pointer-events:none;
  }
  .toast.show{opacity:1;}
  @media(max-width:520px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Registro de muestras de campo</h1>
    <span class="meta-count" id="countLabel">0 muestras</span>
  </header>

  <div class="entry-card" style="position:relative;">
    <p class="form-title">Nueva entrada</p>
    <div class="grid">
      <div class="field id-row">
        <label for="idInput">ID de la muestra *</label>
        <input id="idInput" placeholder="Ej. SU-014" autocomplete="off">
        <div class="id-error-msg" id="idErrorMsg">Ese ID ya existe. Usa uno distinto.</div>
      </div>
      <div class="field">
        <label for="tipoInput">Tipo de muestra *</label>
        <input id="tipoInput" placeholder="Suelo, agua, roca, vegetación...">
      </div>
      <div class="field">
        <label for="geologoInput">Geólogo</label>
        <input id="geologoInput" placeholder="Nombre del geólogo a cargo">
      </div>
      <div class="field">
        <label for="fechaInput">Fecha</label>
        <input id="fechaInput" type="date">
      </div>
      <div class="field">
        <label for="ubicacionInput">Ubicación</label>
        <input id="ubicacionInput" placeholder="Coordenadas o punto de referencia">
      </div>
      <div class="field full">
        <label for="notasInput">Notas</label>
        <textarea id="notasInput" placeholder="Observaciones de campo..."></textarea>
      </div>
      <div class="field full">
        <label>Foto (opcional)</label>
        <div class="photo-row">
          <button type="button" class="file-btn" id="photoBtn">Elegir foto</button>
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
          <img id="photoPreview" class="photo-preview" alt="">
          <span id="photoName" style="font-size:12.5px; color:var(--ink-soft);"></span>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="save-btn" id="saveBtn">Guardar muestra</button>
      <span class="save-hint">* campos obligatorios</span>
    </div>
    <div class="stamp" id="stamp">Duplicado</div>
  </div>

  <div class="sync-row">
    <span class="sync-status" id="syncStatus">Envío automático a Google Sheets: no configurado todavía.</span>
  </div>

  <p class="list-title">Muestras registradas</p>
  <div id="emptyState" class="empty">Todavía no hay muestras. Agrega la primera arriba.</div>
  <div class="cards" id="cardsWrap"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let samples = [];
let pendingPhoto = null;

const idInput = document.getElementById('idInput');
const tipoInput = document.getElementById('tipoInput');
const geologoInput = document.getElementById('geologoInput');
const fechaInput = document.getElementById('fechaInput');
const ubicacionInput = document.getElementById('ubicacionInput');
const notasInput = document.getElementById('notasInput');
const photoBtn = document.getElementById('photoBtn');
const photoInput = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');
const photoName = document.getElementById('photoName');
const saveBtn = document.getElementById('saveBtn');
const idErrorMsg = document.getElementById('idErrorMsg');
const stamp = document.getElementById('stamp');
const entryCard = document.querySelector('.entry-card');
const cardsWrap = document.getElementById('cardsWrap');
const emptyState = document.getElementById('emptyState');
const countLabel = document.getElementById('countLabel');
const toast = document.getElementById('toast');

fechaInput.valueAsDate = new Date();

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2200);
}

photoBtn.addEventListener('click', ()=>photoInput.click());
photoInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev)=>{
    img.onload = ()=>{
      const maxW = 360;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.6);
      photoPreview.src = pendingPhoto;
      photoPreview.classList.add('show');
      photoName.textContent = file.name;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

async function loadSamples(){
  try{
    const result = await window.storage.get('samples', false);
    samples = result && result.value ? JSON.parse(result.value) : [];
  }catch(err){
    samples = [];
  }
  render();
}

async function persist(){
  try{
    const result = await window.storage.set('samples', JSON.stringify(samples), false);
    if(!result){
      showToast('No se pudo guardar. Intenta de nuevo.');
    }
  }catch(err){
    showToast('Error al guardar los datos.');
  }
}

function clearIdError(){
  idInput.classList.remove('error');
  idErrorMsg.classList.remove('show');
}

idInput.addEventListener('input', clearIdError);

function resetForm(){
  idInput.value=''; tipoInput.value=''; geologoInput.value=''; ubicacionInput.value=''; notasInput.value='';
  fechaInput.valueAsDate = new Date();
  pendingPhoto = null;
  photoPreview.classList.remove('show'); photoPreview.src='';
  photoName.textContent='';
  clearIdError();
}

saveBtn.addEventListener('click', async ()=>{
  const id = idInput.value.trim();
  const tipo = tipoInput.value.trim();

  if(!id){
    idInput.classList.add('error');
    idErrorMsg.textContent = 'Ingresa un ID para la muestra.';
    idErrorMsg.classList.add('show');
    idInput.focus();
    return;
  }
  if(!tipo){
    tipoInput.classList.add('error');
    tipoInput.focus();
    return;
  }
  tipoInput.classList.remove('error');

  const exists = samples.some(s => s.id.toLowerCase() === id.toLowerCase());
  if(exists){
    idInput.classList.add('error');
    idErrorMsg.textContent = 'Ese ID ya existe. Usa uno distinto.';
    idErrorMsg.classList.add('show');
    stamp.classList.remove('show');
    void stamp.offsetWidth;
    stamp.classList.add('show');
    entryCard.classList.remove('shake');
    void entryCard.offsetWidth;
    entryCard.classList.add('shake');
    idInput.focus();
    return;
  }

  const newSample = {
    id, tipo,
    geologo: geologoInput.value.trim(),
    fecha: fechaInput.value || '',
    ubicacion: ubicacionInput.value.trim(),
    notas: notasInput.value.trim(),
    foto: pendingPhoto,
    createdAt: Date.now()
  };
  samples.unshift(newSample);
  await persist();
  render();
  resetForm();
  showToast('Muestra guardada.');
  sendToSheet(newSample);
});

function esc(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function removeSample(id){
  samples = samples.filter(s => s.id !== id);
  await persist();
  render();
  showToast('Muestra eliminada.');
}

function render(){
  countLabel.textContent = samples.length + (samples.length===1 ? ' muestra' : ' muestras');
  if(samples.length === 0){
    emptyState.style.display = 'block';
    cardsWrap.innerHTML = '';
    return;
  }
  emptyState.style.display = 'none';
  cardsWrap.innerHTML = samples.map((s, i)=>{
    const num = String(samples.length - i).padStart(3,'0');
    return `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-id">${esc(s.id)}</div>
        <div class="tag-num">N.&deg; ${num}</div>
      </div>
      <div class="tag-type">${esc(s.tipo)}</div>
      <div class="tag-body">
        ${s.foto ? `<img class="tag-photo" src="${s.foto}" alt="Foto de la muestra ${esc(s.id)}">` : ''}
        <div class="tag-info">
          ${s.geologo ? `<div><b>Ge&oacute;logo:</b> ${esc(s.geologo)}</div>` : ''}
          ${s.fecha ? `<div><b>Fecha:</b> ${esc(s.fecha)}</div>` : ''}
          ${s.ubicacion ? `<div><b>Ubicaci&oacute;n:</b> ${esc(s.ubicacion)}</div>` : ''}
        </div>
      </div>
      ${s.notas ? `<div class="tag-notes">${esc(s.notas)}</div>` : ''}
      <button class="tag-remove" data-id="${esc(s.id)}">Eliminar</button>
    </div>`;
  }).join('');

  cardsWrap.querySelectorAll('.tag-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>removeSample(btn.dataset.id));
  });
}

const syncStatus = document.getElementById('syncStatus');

// --- Envío automático a Google Sheets (mismo esquema que el formulario de auxiliares) ---
// 1. Cree un Google Sheet con columnas: ID, Tipo, Geologo, Fecha, Ubicacion, Notas
// 2. En Make.com cree un escenario: Webhooks > Custom webhook  ->  Google Sheets > Add a Row
// 3. Copie la URL que le da Make.com y péguela abajo en WEBHOOK_URL
const WEBHOOK_URL = 'https://hook.us2.make.com/vc4x7b151cg2w47n944v0wcapyvu4i2f';

async function sendToSheet(sample){
  if(!WEBHOOK_URL){
    syncStatus.textContent = 'Envío automático a Google Sheets: no configurado todavía.';
    syncStatus.className = 'sync-status';
    return;
  }
  syncStatus.textContent = 'Enviando a Google Sheets...';
  syncStatus.className = 'sync-status';
  try{
    await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        id: sample.id,
        tipo: sample.tipo,
        geologo: sample.geologo,
        fecha: sample.fecha,
        ubicacion: sample.ubicacion,
        notas: sample.notas
      })
    });
    syncStatus.textContent = 'Enviado a Google Sheets: ' + new Date().toLocaleString('es-CO');
    syncStatus.className = 'sync-status ok';
  }catch(err){
    syncStatus.textContent = 'No se pudo enviar a Google Sheets. Revisa la URL del webhook.';
    syncStatus.className = 'sync-status error';
  }
}

loadSamples();
</script>
</body>
</html>
